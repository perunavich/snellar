[workspace]
members = ["crates/core", "crates/youtube"]
default-members = [".", "crates/core", "crates/youtube"]

[workspace.package]
version = "0.1.0-beta"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1.0.104"
base64 = "0.23"
bytes = "1.12.1"
dirs = "7.0.0"
libc = "0.2.191"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "gzip", "brotli", "http2"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
snellar-core = { path = "crates/core" }
snellar-youtube = { path = "crates/youtube" }
tokio = "1.54.1"

[package]
name = "snellar"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
cxx = "1.0.205"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_gui", "qt_qml", "qt_quickcontrols", "serde"] }
dirs.workspace = true
discord-rich-presence = "1.1.0"
futures-util = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
libc.workspace = true
mpris-server = { version = "0.11.0", features = ["tokio"] }
reqwest.workspace = true
ring = "0.17.14"
rmcp = { version = "3.8.0", features = ["server", "transport-io", "macros"] }
rusqlite.workspace = true
rustls.workspace = true
rustls-platform-verifier = "0.7.1"
schemars = "1.2.3"
serde.workspace = true
serde_json.workspace = true
snellar-core.workspace = true
snellar-youtube.workspace = true
tokio-rustls = { version = "0.26.6", default-features = false }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "net", "io-util", "sync", "time", "fs", "signal"] }
zbus = "6.2"
zip = { version = "9.3.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
snellar-core = { workspace = true, features = ["test-guard"] }

[build-dependencies]
cxx-qt-build = "0.10.0"
qt-build-utils = "0.10.0"
