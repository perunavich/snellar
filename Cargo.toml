[workspace]
members = ["crates/app", "crates/core", "crates/youtube"]
default-members = [".", "crates/app", "crates/core", "crates/youtube"]

[workspace.package]
version = "0.1.2-beta"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1.0.104"
base64 = "0.23"
bytes = "1.12.1"
dirs = "7.0.0"
libc = "0.2.191"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "gzip", "brotli", "http2"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
snellar-app = { path = "crates/app" }
snellar-core = { path = "crates/core" }
snellar-youtube = { path = "crates/youtube" }
tokio = "1.54.1"

[package]
name = "snellar"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cxx = "1.0.205"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_gui", "qt_qml", "qt_quickcontrols", "serde"] }
serde.workspace = true
serde_json.workspace = true
snellar-app.workspace = true
snellar-core.workspace = true

[features]
default = ["dev-qml"]
dev-qml = []

[build-dependencies]
cxx-qt-build = "0.10.0"
qt-build-utils = "0.10.0"
