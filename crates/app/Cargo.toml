[package]
name = "snellar-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
dirs.workspace = true
discord-rich-presence = "1.1.0"
futures-util = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
libc.workspace = true
mpris-server = { version = "0.11.0", features = ["tokio"] }
reqwest.workspace = true
ring = "0.17.14"
rmcp = { version = "3.8.0", features = ["server", "transport-io", "macros"] }
rusqlite.workspace = true
rustls.workspace = true
rustls-platform-verifier = "0.7.1"
schemars = "1.2.3"
serde.workspace = true
serde_json.workspace = true
snellar-core.workspace = true
snellar-youtube.workspace = true
tokio-rustls = { version = "0.26.6", default-features = false }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "net", "io-util", "sync", "time", "fs", "signal"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
zbus = "6.2"
zip = { version = "9.3.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
